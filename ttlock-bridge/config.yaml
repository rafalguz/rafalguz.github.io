name: SISU TTLock Bridge
version: "0.1.0"
slug: ttlock-bridge
description: "Read-only TTLock lock 401 events -> Home Assistant SISU"
url: "https://github.com/rafalguz/rafalguz.github.io"
arch:
  - amd64
startup: services
boot: auto
init: false
homeassistant_api: true
hassio_role: default
options:
  app_id: ""
  app_secret: ""
  access_token: ""
  operator_uid: ""
  jsessionid: ""
  lock_id: 35090848
  poll_seconds: 5
  max_event_age_seconds: 120
  dry_run: true
schema:
  app_id: str
  app_secret: password
  access_token: password
  operator_uid: str
  jsessionid: password
  lock_id: int
  poll_seconds: int(3,60)
  max_event_age_seconds: int(10,600)
  dry_run: bool
