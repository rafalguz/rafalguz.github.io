name: Inspect EZVIZ SDK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect_ezviz_sdk.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official EZVIZ Android SDK
        run: |
          curl -L --fail -o ezviz-sdk.aar https://repo.maven.apache.org/maven2/io/github/ezviz-open/ezviz-sdk/5.27.3/ezviz-sdk-5.27.3.aar
          mkdir sdk
          unzip -q ezviz-sdk.aar -d sdk

      - name: Print talkback Java bytecode and signatures
        run: |
          classes="com.videogo.stream.EZTalkback com.videogo.stream.EZStreamCtrl com.videogo.openapi.bean.EZQosParams com.ez.player.EZVoiceTalk com.ez.player.EZMediaPlayer"
          for c in $classes; do
            echo "===== JAVAP $c ====="
            javap -classpath sdk/classes.jar -p -s -c "$c" 2>&1 || true
          done
          echo "===== COM EZ STREAM CLASSES ====="
          jar tf sdk/classes.jar | grep '^com/ez/stream/' | head -n 500 || true

      - name: Inspect native talk symbols
        run: |
          for f in sdk/jni/arm64-v8a/libezstreamclient.so sdk/jni/arm64-v8a/libNPQos.so; do
            echo "===== NATIVE $f ====="
            readelf -Ws "$f" 2>/dev/null | grep -Ei 'VoiceTalk|inputVoice|startVoice|CASClient_.*Voice|TTSCLN_|NPQ_|QosTalk|TalkClient' | head -n 2500 || true
            echo "===== STRINGS $f ====="
            strings "$f" | grep -Ei 'VoiceTalk|inputVoice|startVoice|CASClient_.*Voice|TTSCLN_|NPQ_|QosTalk|TalkClient' | head -n 2500 || true
          done
