name: Inspect EZVIZ SDK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect_ezviz_sdk.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official EZVIZ Android SDK
        run: |
          curl -L --fail -o ezviz-sdk.aar https://repo.maven.apache.org/maven2/io/github/ezviz-open/ezviz-sdk/5.27.3/ezviz-sdk-5.27.3.aar
          mkdir sdk
          unzip -q ezviz-sdk.aar -d sdk
          echo "===== JARS ====="
          find sdk -type f -name '*.jar' -print
          echo "===== RELEVANT SO ====="
          find sdk -type f -name '*.so' | grep -Ei 'ezstream|npq|qos|voice' | head -n 200 || true

      - name: Locate relevant classes in all jars
        run: |
          find sdk -type f -name '*.jar' -print | while read j; do
            hits=$(jar tf "$j" | grep -Ei '(^|/)(NativeApi|EZPlayer|EZTalkback|EZStreamCtrl|EZQosParams|EZVoiceTalk).*class$' || true)
            if [ -n "$hits" ]; then
              echo "===== $j ====="
              echo "$hits"
            fi
          done

      - name: Disassemble talkback orchestration
        run: |
          CP=$(find sdk -type f -name '*.jar' -print | paste -sd: -)
          for c in \
            com.videogo.openapi.EZPlayer \
            com.videogo.stream.EZTalkback \
            com.videogo.stream.EZStreamCtrl \
            com.videogo.openapi.bean.EZQosParams \
            com.ez.player.EZVoiceTalk \
            com.ez.stream.NativeApi; do
            echo "===== JAVAP-C $c ====="
            javap -classpath "$CP" -p -c -s "$c" 2>&1 || true
          done

      - name: Native voice symbols
        run: |
          find sdk -type f \( -name 'libezstreamclient.so' -o -name 'libNPQos.so' -o -name '*Qos*.so' \) -print | while read f; do
            echo "===== NATIVE $f ====="
            readelf -Ws "$f" 2>/dev/null | grep -Ei 'VoiceTalk|inputVoice|NPQ_|Qos|Talk|ezplayer' | head -n 1600 || true
          done
