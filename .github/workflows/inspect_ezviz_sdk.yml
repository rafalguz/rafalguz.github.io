name: Inspect EZVIZ SDK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect_ezviz_sdk.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official EZVIZ Android SDK
        run: |
          curl -L --fail -o ezviz-sdk.aar https://repo.maven.apache.org/maven2/io/github/ezviz-open/ezviz-sdk/5.27.3/ezviz-sdk-5.27.3.aar
          mkdir sdk cls
          unzip -q ezviz-sdk.aar -d sdk
          (cd cls && jar xf ../sdk/classes.jar)
          CP=$(find sdk -type f -name '*.jar' -print | paste -sd: -)
          echo "$CP" > classpath.txt

      - name: Locate quick-reply and custom-voice code
        run: |
          for term in quickReply QuickReply voiceId VoiceInfo specialBizs voices DoorCallQuickReply alarm/sound answerCall quick_reply; do
            echo "===== TERM $term ====="
            grep -aRil "$term" cls --include='*.class' | sed 's#^cls/##;s#/#.#g;s#\.class$##' | sort -u | head -n 300 || true
          done

      - name: Show strings around quick reply endpoints
        run: |
          echo "===== CLASS STRINGS ====="
          find cls -type f -name '*.class' -print0 | xargs -0 strings | grep -Ei 'quick.?reply|voice.?id|specialBizs|/voices|door.?call|alarm/sound|answer.?call|voice.?info' | sort -u | head -n 1500 || true
          echo "===== NATIVE STRINGS ====="
          find sdk -type f -name '*.so' -print0 | xargs -0 strings | grep -Ei 'quick.?reply|voice.?id|specialBizs|/voices|door.?call|alarm/sound|answer.?call|voice.?info' | sort -u | head -n 2000 || true

      - name: Disassemble matching classes
        run: |
          CP=$(cat classpath.txt)
          {
            grep -aRil 'quickReply' cls --include='*.class'
            grep -aRil 'QuickReply' cls --include='*.class'
            grep -aRil 'voiceId' cls --include='*.class'
            grep -aRil 'specialBizs' cls --include='*.class'
            grep -aRil 'DoorCallQuickReply' cls --include='*.class'
          } | sort -u | sed 's#^cls/##;s#/#.#g;s#\.class$##' | head -n 120 | while read c; do
            echo "===== JAVAP-C $c ====="
            javap -classpath "$CP" -p -c -s "$c" 2>&1 || true
          done
