name: Inspect EZVIZ SDK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect_ezviz_sdk.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official EZVIZ Android SDK
        run: |
          curl -L --fail -o ezviz-sdk.aar https://repo.maven.apache.org/maven2/io/github/ezviz-open/ezviz-sdk/5.27.3/ezviz-sdk-5.27.3.aar
          mkdir sdk
          unzip -q ezviz-sdk.aar -d sdk
          echo "===== JARS ====="
          find sdk -type f -name '*.jar' -print

      - name: Find and decompile talk classes
        run: |
          find sdk -type f -name '*.jar' | while read j; do
            echo "===== SCAN $j ====="
            jar tf "$j" | grep -E '(^|/)(NativeApi|EZVoiceTalk|EZStreamClientManager|InitParam|EZTalkback|EZStreamParamHelp).*class$' || true
          done

          for cls in             com.ez.stream.NativeApi             com.ez.stream.InitParam             com.ez.stream.EZStreamClientManager             com.ez.player.EZVoiceTalk             com.videogo.stream.EZTalkback             com.videogo.stream.EZStreamParamHelp
          do
            echo "===== CLASS $cls ====="
            found=0
            find sdk -type f -name '*.jar' | while read j; do
              p="$(echo "$cls" | tr . /).class"
              if jar tf "$j" | grep -qx "$p"; then
                echo "----- IN $j -----"
                javap -classpath "$j" -p -s -c "$cls" 2>&1 || true
              fi
            done
          done

      - name: Show native public talk symbols
        run: |
          f=sdk/jni/arm64-v8a/libezstreamclient.so
          echo "===== SYMBOLS ====="
          readelf -Ws "$f" 2>/dev/null | grep -Ei 'Java_com_ez_stream_NativeApi_(startVoiceTalk|startVoiceTalkV2|inputVoiceTalkData|stopVoiceTalk)|ezstream_(startVoiceTalk|startVoiceTalkV2|inputVoiceTalkData|stopVoiceTalk)|CASClient_(VoiceTalk|StartP2PVoiceTalk)' | head -n 500 || true
          echo "===== STRINGS ====="
          strings "$f" | grep -Ei 'startVoiceTalk|inputVoiceTalkData|VoiceTalk(Start|Input|Stop)|getVoiceTalkUrl|talkurl|talkServer|talkToken|qos' | head -n 1200 || true
